{%- assign sd_author = site.data.settings.author_name | default: 'Azmat Mungur' -%}
{%- if page.layout == 'post' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "image": {{ page.image | default: site.data.settings.social_image | absolute_url | jsonify }},
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "keywords": {{ page.tags | join: ', ' | jsonify }},
  "author": { "@type": "Person", "name": {{ sd_author | jsonify }}, "url": {{ '/' | absolute_url | jsonify }} },
  "publisher": { "@type": "Person", "name": {{ sd_author | jsonify }} }
}
</script>
{%- elsif page.url == '/' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.data.settings.title | jsonify }},
  "description": {{ site.data.settings.description | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "author": { "@type": "Person", "name": {{ sd_author | jsonify }} }
}
</script>
{%- endif -%}
