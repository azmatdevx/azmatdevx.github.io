<!-- begin header -->
<header class="header" id="top">
  <div class="header__inner">

    <!-- Logo: left -->
    <a class="header__logo" href="{{ site.baseurl }}/" aria-label="{{ site.name }} home">
      <img src="{{ '/images/azmat-logo-coral.png' | relative_url }}" alt="{{ site.name }}" class="header__logo-img header__logo-img--light" width="49" height="40">
      <img src="{{ '/images/azmat-logo-coral-dark.png' | relative_url }}" alt="" class="header__logo-img header__logo-img--dark" width="49" height="40" aria-hidden="true">
    </a>

    <!-- Nav links: right -->
    <nav class="nav--desktop" aria-label="Primary navigation">
      <ul class="nav__list list-reset">
        {% for item in site.data.settings.menu_settings.menu_items %}
        <li class="nav__item">
          <a href="{{ item.url | relative_url }}" class="nav__link{% if page.url == item.url %} active-link{% endif %}">{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>

    <!-- Theme switch -->
    <button class="theme-switch toggle-theme" type="button" role="switch" aria-checked="false" aria-label="Dark theme">
      <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="theme-switch__thumb" aria-hidden="true"></span>
    </button>

    <!-- Mobile hamburger -->
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <div></div>
    </button>

  </div>

  <!-- Mobile dropdown nav -->
  <nav class="main-nav" id="main-nav" aria-label="Mobile navigation">
    <ul class="nav__list list-reset">
      {% for item in site.data.settings.menu_settings.menu_items %}
      <li class="nav__item">
        <a href="{{ item.url | relative_url }}" class="nav__link{% if page.url == item.url %} active-link{% endif %}">{{ item.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </nav>

</header>

<script>
(function () {
  var header = document.getElementById('top');
  function onScroll() {
    header.classList.toggle('header--scrolled', window.scrollY > 20);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
<!-- end header -->
