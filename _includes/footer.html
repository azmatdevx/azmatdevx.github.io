<!-- begin footer -->
<footer class="footer">

  <div class="footer__inner">
    <h2 class="footer__heading">Let's <em>connect</em></h2>
    <p class="footer__sub">Find me across the web — I'm always open to interesting conversations.</p>

    {% if site.data.settings.social %}
    <div class="footer__socials">
      {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" class="ap__hero-btn ap__hero-btn--ghost" aria-label="{{ item.name }}" {% unless item.link contains 'mailto' %}target="_blank" rel="noopener"{% endunless %}>
        <i class="{{ item.icon }}"></i>{{ item.name }}
      </a>
      {% endfor %}
    </div>
    {% endif %}

    <p class="footer__copy">&copy; {{ site.time | date: '%Y' }} Azmat Mungur <span class="footer__tagline">· Built with intent</span></p>
  </div>
</footer>
<!-- end footer -->
