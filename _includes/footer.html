<footer class="site-footer">
  <div class="wrap wrap--wide">
    <p>
      <span>&copy; {{ site.time | date: '%Y' }} Azmat Mungur</span>
      {% for item in site.data.settings.social %}
      <a href="{{ item.link }}"{% unless item.link contains 'mailto' %} rel="noopener"{% endunless %}>{{ item.name }}</a>
      {% endfor %}
      <span class="handle">{{ site.data.settings.handle }}</span>
    </p>
  </div>
</footer>
