---
layout: default
---

<article class="wrap page">
  <h1 class="page__title">{{ page.title | escape }}</h1>
  {% if page.description %}<p class="page__lede">{{ page.description }}</p>{% endif %}

  {% if page.toc == true %}
  <nav class="toc" aria-labelledby="toc-title">
    <p class="toc__title" id="toc-title">Contents</p>
    {% include toc.html html=content ordered=true h_min=2 %}
  </nav>
  {% endif %}

  <div class="prose">
    {{ content }}
  </div>
</article>
