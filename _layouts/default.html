<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body class="{% if page.url == '/' %}home-page {% endif %}{% if page.body_class %}{{ page.body_class }} {% endif %}dark-page">

  {% include analytics.html %}

  {% unless page.url == '/' %}
  <!-- Site-wide ambient background: glow -->
  <div class="site-geo" aria-hidden="true">
    <svg class="ap__hero-glow" viewBox="0 0 1526 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="sgg0" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="107"/>
        </filter>
        <filter id="sgg1" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="150"/>
        </filter>
        <linearGradient id="sgga" x1="100%" y1="0%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#2B66FF"/>
          <stop offset="100%" stop-color="#2B66FF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="sggb" x1="100%" y1="100%" x2="40%" y2="0%">
          <stop offset="0%" stop-color="#7BA8FF"/>
          <stop offset="100%" stop-color="#2B66FF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g opacity="0.12" filter="url(#sgg0)">
        <path d="M800 80L1440 0V600L800 520V80Z" fill="url(#sgga)"/>
      </g>
      <g opacity="0.15" filter="url(#sgg1)">
        <path d="M900 300L1526 200V900L900 780V300Z" fill="url(#sggb)"/>
      </g>
    </svg>
  </div>
  {% endunless %}

  <!-- begin global wrap -->
  <div class="global-wrap">

    {% include header.html %}

    <!-- begin content -->
    <main class="content" aria-label="Content">
      {{ content }}
    </main>
    <!-- end content -->

    {% include section-subscribe.html %}

    {% include footer.html %}
  </div>
  <!-- end global wrap -->

  <script src="{{ '/js/scripts.js' | relative_url }}"></script>
  <script src="{{ '/js/common.js' | relative_url }}"></script>
</body>

</html>
